<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Calendar</title>
    <style>
        :root {
            --bg-color: #1b2028;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #e2e8f0;
            --accent-color: #8ab4f8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 50px;
        }

        /* Top Bar Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 50px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            opacity: 0.8;
            cursor: pointer;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main Fullscreen Dashboard Layout */
        .dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 40px;
            align-items: center;
            height: calc(100vh - 110px);
        }

        /* Left side: Clock & Header */
        .clock-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 20px;
        }

        .time {
            font-size: calc(5vw + 2rem);
            font-weight: 200;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .date-str {
            font-size: calc(1vw + 1rem);
            opacity: 0.7;
            font-weight: 300;
        }

        /* Right side: Full-size Calendar */
        .calendar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 35px;
            height: 90%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.8rem;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            flex: 1;
            text-align: center;
        }

        .day-name {
            font-size: 1rem;
            opacity: 0.5;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: default;
            transition: all 0.2s ease;
        }

        .day.empty {
            visibility: hidden;
        }

        .day.today {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 900px) {
            body { overflow: auto; }
            .fullscreen-container { height: auto; padding: 20px; }
            .dashboard { grid-template-columns: 1fr; height: auto; gap: 30px; }
            .clock-section { align-items: center; text-align: center; padding-left: 0; }
            .time { font-size: 4rem; }
            .calendar-card { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <!-- Top Controls Bar -->
        <div class="controls">
            <div class="color-picker-wrapper">
                <input type="color" id="bgPicker" value="#1b2028">
                <span>Theme Color</span>
            </div>
            
            <div class="control-group">
                <button class="action-btn" id="musicBtn" onclick="toggleZenMusic()">
                    <span id="musicIcon">🎵</span> Zen Sound
                </button>
                <button class="action-btn" onclick="toggleFullscreen()">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>

        <!-- Fullscreen Dashboard -->
        <div class="dashboard">
            <!-- Left Side: Live Time & Date -->
            <div class="clock-section">
                <div class="time" id="clock">00:00:00</div>
                <div class="date-str" id="fullDate">Loading date...</div>
            </div>

            <!-- Right Side: Calendar -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
                    <span id="monthYear"></span>
                    <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar populated via JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Real-Time Clock
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fullDate').textContent = now.toLocaleDateString(undefined, options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Calendar Logic
        let currentDate = new Date();

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", 
                                "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;

            const daysOfWeek = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.classList.add('day-name');
                dayHeader.textContent = day;
                grid.appendChild(dayHeader);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                grid.appendChild(emptyCell);
            }

            for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day');
                dayCell.textContent = dayNum;

                if (dayNum === today.getDate() && 
                    month === today.getMonth() && 
                    year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }

                grid.appendChild(dayCell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        renderCalendar();

        // Theme Switcher & Auto-Text Contrast
        const bgPicker = document.getElementById('bgPicker');
        bgPicker.addEventListener('input', (e) => {
            const hex = e.target.value;
            document.documentElement.style.setProperty('--bg-color', hex);
            
            const r = parseInt(hex.substr(1,2),16);
            const g = parseInt(hex.substr(3,2),16);
            const b = parseInt(hex.substr(5,2),16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            if (brightness > 128) {
                document.documentElement.style.setProperty('--text-color', '#1a202c');
                document.documentElement.style.setProperty('--card-bg', 'rgba(0, 0, 0, 0.05)');
                document.documentElement.style.setProperty('--border-color', 'rgba(0, 0, 0, 0.1)');
            } else {
                document.documentElement.style.setProperty('--text-color', '#e2e8f0');
                document.documentElement.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.05)');
                document.documentElement.style.setProperty('--border-color', 'rgba(255, 255, 255, 0.08)');
            }
        });

        // Browser Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Zen Audio Synth
        let audioCtx = null;
        let isPlaying = false;
        let mainGain = null;
        let oscillators = [];

        function toggleZenMusic() {
            const btn = document.getElementById('musicBtn');
            if (!isPlaying) {
                startZenMusic();
                btn.style.background = 'rgba(255, 255, 255, 0.25)';
                isPlaying = true;
            } else {
                stopZenMusic();
                btn.style.background = 'var(--card-bg)';
                isPlaying = false;
            }
        }

        function startZenMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            mainGain.connect(audioCtx.destination);

            const baseFreqs = [110, 164.81, 196.00, 220, 293.66];

            oscillators = baseFreqs.map(freq => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.detune.setValueAtTime((Math.random() - 0.5) * 8, audioCtx.currentTime);
                osc.connect(mainGain);
                osc.start();
                return osc;
            });
        }

        function stopZenMusic() {
            if (mainGain) {
                mainGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
                setTimeout(() => {
                    oscillators.forEach(osc => osc.stop());
                    oscillators = [];
                }, 1000);
            }
        }
    </script>
</body>
</html>
