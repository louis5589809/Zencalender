<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Calendar</title>
    <style>
        :root {
            --bg-color: #1b2028;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #e2e8f0;
            --accent-color: #8ab4f8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 50px;
        }

        /* Top Bar Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 50px;
            gap: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            opacity: 0.8;
            cursor: pointer;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        /* Timezone Search Input */
        .tz-search-container {
            position: relative;
            flex: 1;
            max-width: 320px;
        }

        .tz-input {
            width: 100%;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .tz-input::placeholder {
            color: var(--text-color);
            opacity: 0.5;
        }

        .tz-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .tz-option {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tz-option:hover {
            background: var(--card-bg);
            color: var(--accent-color);
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main Fullscreen Dashboard Layout */
        .dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 40px;
            align-items: center;
            height: calc(100vh - 110px);
        }

        .clock-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 20px;
        }

        .location-tag {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 5px;
            color: var(--accent-color);
            font-weight: 500;
        }

        .time {
            font-size: calc(5vw + 2rem);
            font-weight: 200;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .date-str {
            font-size: calc(1vw + 1rem);
            opacity: 0.7;
            font-weight: 300;
        }

        .calendar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 35px;
            height: 90%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.8rem;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            flex: 1;
            text-align: center;
        }

        .day-name {
            font-size: 1rem;
            opacity: 0.5;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: default;
            transition: all 0.2s ease;
        }

        .day.empty {
            visibility: hidden;
        }

        .day.today {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .fullscreen-container { height: auto; padding: 20px; }
            .controls { flex-wrap: wrap; height: auto; }
            .dashboard { grid-template-columns: 1fr; height: auto; gap: 30px; }
            .clock-section { align-items: center; text-align: center; padding-left: 0; }
            .time { font-size: 4rem; }
            .calendar-card { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <!-- Top Controls Bar -->
        <div class="controls">
            <div class="color-picker-wrapper">
                <input type="color" id="bgPicker" value="#1b2028">
                <span>Theme</span>
            </div>

            <!-- Country / Time Zone Search -->
            <div class="tz-search-container">
                <input type="text" id="tzInput" class="tz-input" placeholder="🔍 Search Country or City..." autocomplete="off">
                <div id="tzDropdown" class="tz-dropdown"></div>
            </div>
            
            <div class="control-group">
                <button class="action-btn" id="musicBtn" onclick="toggleZenMusic()">
                    <span id="musicIcon">🎵</span> Zen Sound
                </button>
                <button class="action-btn" onclick="toggleFullscreen()">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>

        <!-- Fullscreen Dashboard -->
        <div class="dashboard">
            <!-- Left Side: Live Time & Date -->
            <div class="clock-section">
                <div class="location-tag" id="locationTag">Local Time</div>
                <div class="time" id="clock">00:00:00</div>
                <div class="date-str" id="fullDate">Loading date...</div>
            </div>

            <!-- Right Side: Calendar -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
                    <span id="monthYear"></span>
                    <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar populated via JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let currentDate = new Date();

        // Supported Time Zones List
        const timeZones = Intl.supportedValuesOf('timeZone');

        const tzInput = document.getElementById('tzInput');
        const tzDropdown = document.getElementById('tzDropdown');

        tzInput.addEventListener('input', () => {
            const query = tzInput.value.toLowerCase().trim();
            tzDropdown.innerHTML = '';

            if (!query) {
                tzDropdown.style.display = 'none';
                return;
            }

            const matches = timeZones.filter(tz => tz.toLowerCase().includes(query)).slice(0, 10);

            if (matches.length > 0) {
                matches.forEach(tz => {
                    const option = document.createElement('div');
                    option.classList.add('tz-option');
                    option.textContent = tz.replace(/_/g, ' ');
                    option.addEventListener('click', () => selectTimeZone(tz));
                    tzDropdown.appendChild(option);
                });
                tzDropdown.style.display = 'block';
            } else {
                tzDropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!tzInput.contains(e.target) && !tzDropdown.contains(e.target)) {
                tzDropdown.style.display = 'none';
            }
        });

        function selectTimeZone(tz) {
            currentSelectedTimeZone = tz;
            tzInput.value = '';
            tzDropdown.style.display = 'none';
            
            const city = tz.split('/').pop().replace(/_/g, ' ');
            const country = tz.split('/')[0].replace(/_/g, ' ');
            document.getElementById('locationTag').textContent = `${city} (${country})`;

            updateClock();
            renderCalendar();
        }

        // Get time numbers relative to selected timezone
        function getZoneDateParts() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: currentSelectedTimeZone,
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: 'numeric', minute: 'numeric', second: 'numeric',
                hour12: false
            });
            
            const parts = formatter.formatToParts(now);
            const p = {};
            parts.forEach(part => p[part.type] = part.value);
            return p;
        }

        // Real-Time Clock
        function updateClock() {
            try {
                const p = getZoneDateParts();
                const hours = String(p.hour === '24' ? '00' : p.hour).padStart(2, '0');
                const minutes = String(p.minute).padStart(2, '0');
                const seconds = String(p.second).padStart(2, '0');
                
                document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

                const targetDate = new Date(p.year, p.month - 1, p.day);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('fullDate').textContent = targetDate.toLocaleDateString(undefined, options);
            } catch (e) {
                console.error("Invalid time zone", e);
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Calendar Logic
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", 
                                "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;

            const daysOfWeek = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.classList.add('day-name');
                dayHeader.textContent = day;
                grid.appendChild(dayHeader);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            const p = getZoneDateParts();
            const zoneYear = parseInt(p.year);
            const zoneMonth = parseInt(p.month) - 1;
            const zoneDay = parseInt(p.day);

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                grid.appendChild(emptyCell);
            }

            for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day');
                dayCell.textContent = dayNum;

                if (dayNum === zoneDay && month === zoneMonth && year === zoneYear) {
                    dayCell.classList.add('today');
                }

                grid.appendChild(dayCell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        renderCalendar();

        // Dynamic Color Switcher
        const bgPicker = document.getElementById('bgPicker');
        bgPicker.addEventListener('input', (e) => {
            const hex = e.target.value;
            document.documentElement.style.setProperty('--bg-color', hex);
            
            const r = parseInt(hex.substr(1,2),16);
            const g = parseInt(hex.substr(3,2),16);
            const b = parseInt(hex.substr(5,2),16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            if (brightness > 128) {
                document.documentElement.style.setProperty('--text-color', '#1a202c');
                document.documentElement.style.setProperty('--card-bg', 'rgba(0, 0, 0, 0.05)');
                document.documentElement.style.setProperty('--border-color', 'rgba(0, 0, 0, 0.1)');
                document.documentElement.style.setProperty('--input-bg', 'rgba(0, 0, 0, 0.08)');
            } else {
                document.documentElement.style.setProperty('--text-color', '#e2e8f0');
                document.documentElement.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.05)');
                document.documentElement.style.setProperty('--border-color', 'rgba(255, 255, 255, 0.08)');
                document.documentElement.style.setProperty('--input-bg', 'rgba(255, 255, 255, 0.1)');
            }
        });

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Zen Audio Generator
        let audioCtx = null;
        let isPlaying = false;
        let mainGain = null;
        let oscillators = [];

        function toggleZenMusic() {
            const btn = document.getElementById('musicBtn');
            if (!isPlaying) {
                startZenMusic();
                btn.style.background = 'rgba(255, 255, 255, 0.25)';
                isPlaying = true;
            } else {
                stopZenMusic();
                btn.style.background = 'var(--card-bg)';
                isPlaying = false;
            }
        }

        function startZenMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            mainGain.connect(audioCtx.destination);

            const baseFreqs = [110, 164.81, 196.00, 220, 293.66];

            oscillators = baseFreqs.map(freq => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.detune.setValueAtTime((Math.random() - 0.5) * 8, audioCtx.currentTime);
                osc.connect(mainGain);
                osc.start();
                return osc;
            });
        }

        function stopZenMusic() {
            if (mainGain) {
                mainGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
                setTimeout(() => {
                    oscillators.forEach(osc => osc.stop());
                    oscillators = [];
                }, 1000);
            }
        }
    </script>
</body>
</html>
